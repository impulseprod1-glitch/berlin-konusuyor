<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>ABD kesintileri – video sahnesi</title>
<style>
  /* Turkish needs latin-ext (ğ, ş, İ, ı), so every face ships both subsets. */
  @font-face{font-family:'Anton';src:url(fonts/anton-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212}
  @font-face{font-family:'Anton';src:url(fonts/anton-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF}
  @font-face{font-family:'Fraunces';font-weight:100 900;src:url(fonts/fraunces-latin-full-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212}
  @font-face{font-family:'Fraunces';font-weight:100 900;src:url(fonts/fraunces-latin-ext-full-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF}
  @font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;src:url(fonts/fraunces-latin-full-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212}
  @font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;src:url(fonts/fraunces-latin-ext-full-italic.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF}
  @font-face{font-family:'Inter';font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212}
  @font-face{font-family:'Inter';font-weight:100 900;src:url(fonts/inter-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF}
  @font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212}
  @font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(fonts/jetbrains-mono-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF}
  html,body{margin:0;background:#000}
  canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script>
  // ?v=v1-sinematik  → loads that scene file; ?t=12.5 → shows a still (for previewing in a browser).
  const q = new URLSearchParams(location.search);
  const s = document.createElement('script');
  s.src = (q.get('v') || 'v1-sinematik') + '.js';
  s.onload = async () => {
    const faces = ['400 40px Anton', '300 40px Fraunces', 'italic 300 40px Fraunces', '600 40px Fraunces',
      'italic 600 40px Fraunces', '400 40px Inter', '700 40px Inter', '500 40px "JetBrains Mono"'];
    // Load both subsets of every face before the first frame.
    await Promise.all(faces.map(f => document.fonts.load(f, 'AaĞğŞşİı')));
    window.READY = true;
    const ctx = document.getElementById('c').getContext('2d');
    window.renderFrame = t => VIDEO.draw(ctx, t);
    window.frameJpeg = (t, q) => { VIDEO.draw(ctx, t); return document.getElementById('c').toDataURL('image/jpeg', q || 0.95); };
    if (q.has('t')) renderFrame(parseFloat(q.get('t')));
    else if (q.has('play')) { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % VIDEO.duration); requestAnimationFrame(loop); }; loop(); }
  };
  document.body.appendChild(s);
</script>
</body>
</html>
