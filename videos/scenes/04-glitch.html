<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>04 — Glitch: Manipüle Edilemeyen Zihin</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>
  :root { --cy: #19f0ff; --mg: #ff2e88; --wh: #f2f7ff; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #03050a; }
  #stage, #shake, canvas, .ov { position: absolute; inset: 0; }
  canvas { width: 1080px; height: 1920px; }
  .seg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
  .gl { position: relative; white-space: nowrap; font-family: 'Space Grotesk'; font-weight: 700; line-height: 1.08; letter-spacing: -.01em; color: var(--wh); margin: 6px 0; }
  .gl.big { font-family: 'Unbounded'; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
  .gl.dim .m { color: #9fb3c8; }
  .gl.atk .m { color: #ff4d97; }
  .gl > span { display: block; }
  .gl .r, .gl .b { position: absolute; left: 0; top: 0; right: 0; mix-blend-mode: screen; opacity: 0; }
  .gl .r { color: var(--mg); }
  .gl .b { color: var(--cy); }
  .strike { position: absolute; left: -30px; right: -30px; top: 52%; height: 10px; background: var(--cy); box-shadow: 0 0 24px var(--cy); transform-origin: 0 50%; transform: scaleX(0); }
  #scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, rgba(0,0,0,0) 2px 4px); mix-blend-mode: multiply; }
  #vig { background: radial-gradient(ellipse 80% 65% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.85) 100%); }
  #fade { background: #000; }
  #hud { font-family: 'Space Grotesk'; font-weight: 500; font-size: 26px; color: rgba(25, 240, 255, .75); letter-spacing: .12em; }
  #hud .c { position: absolute; width: 70px; height: 70px; border: 3px solid rgba(25,240,255,.6); }
  #hud .tl { left: 56px; top: 56px; border-right: 0; border-bottom: 0; }
  #hud .tr { right: 56px; top: 56px; border-left: 0; border-bottom: 0; }
  #hud .bl { left: 56px; bottom: 56px; border-right: 0; border-top: 0; }
  #hud .br { right: 56px; bottom: 56px; border-left: 0; border-top: 0; }
  #hud .tc { position: absolute; left: 150px; top: 76px; }
  #hud .cnt { position: absolute; right: 150px; top: 76px; }
  #hud .meter { position: absolute; left: 150px; bottom: 80px; display: flex; gap: 6px; align-items: flex-end; height: 40px; }
  #hud .meter i { width: 8px; background: rgba(25,240,255,.7); }
  #hud .hex { position: absolute; right: 150px; bottom: 76px; color: rgba(255, 46, 136, .7); }
  #hud .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--mg); margin-right: 14px; vertical-align: 1px; }
  #ring { position: absolute; left: 50%; top: 50%; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; border-radius: 50%; border: 4px solid var(--cy); box-shadow: 0 0 60px var(--cy), inset 0 0 60px var(--cy); opacity: 0; }
  #sweep { position: absolute; left: 0; right: 0; height: 160px; top: 0; background: linear-gradient(180deg, rgba(25,240,255,0), rgba(25,240,255,.18) 80%, rgba(220,255,255,.7) 98%, rgba(25,240,255,0)); opacity: 0; mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="shake"><div id="segs"></div><div id="ring"></div></div>
  <div class="ov" id="sweep"></div>
  <canvas id="noise" width="1080" height="1920"></canvas>
  <div class="ov" id="scan"></div>
  <div class="ov" id="vig"></div>
  <div class="ov" id="hud">
    <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
    <div class="tc"><span class="dot"></span><span id="tc">00:00:00</span></div>
    <div class="cnt" id="cnt">01 / 12</div>
    <div class="meter" id="meter"></div>
    <div class="hex" id="hex">0x00</div>
  </div>
  <div class="ov" id="fade"></div>
</div>

<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script src="shared/stage.js"></script>
<script>
const { createScene, mulberry32, hashNoise, smoothNoise, clamp, lerp, smooth } = Stage;
const FPS = 30;
const DUR = 50;
const up = (s) => s.toLocaleUpperCase('tr');

// [başlangıç, bitiş, [[metin, sınıf]]]
const SEGS = [
  [1.0, 5.2, [['Tehlikeli derecede', ''], ['eğitimli ol.', 'big']]],
  [5.2, 8.6, [['Bilgili bir', ''], ['insan ol.', 'big']]],
  [8.6, 12.0, [['Aldatılması', ''], ['daha zor.', 'big']]],
  [12.0, 15.4, [['Sohbette', ''], ['daha keskin.', 'big']]],
  [15.4, 19.0, [['Durumları okumada', ''], ['daha iyi.', 'big']]],
  [19.0, 25.0, [['Yüzyılların bilgeliği', ''], ['ve bilgisine', 'dim'], ['başvurabilme', 'big'], ['yeteneğine sahip.', '']]],
  [25.0, 29.2, [['Daha bilgili.', 'big'], ['Daha ilginç.', 'big'], ['Daha yetkin.', 'big']]],
  [29.2, 32.8, [['Durmaksızın', 'big'], ['öğren.', 'big']]],
  [32.8, 37.0, [['İyi yaşanmış,', ''], ['iyi bilgilenmiş', ''], ['bir zihin', 'big']]],
  [37.0, 41.0, [['manipüle etmek,', 'atk big'], ['korkutmak', 'atk big'], ['veya bastırmak', 'atk big']]],
  [41.0, 43.6, [['açısından', 'dim'], ['son derece', '']]],
  [43.6, DUR, [['zordur.', 'big final']]],
];
const ATTACK = 9, FINAL = 11;
const GLYPHS = '01<>/\\[]{}#$%&*+=?░▒▓█ΞΔ∑λ';

const S = createScene({ duration: DUR, fonts: ['700 100px "Space Grotesk"', '900 100px Unbounded', '500 26px "Space Grotesk"'] });
const { tl } = S;

S.ready.then(() => {
  const root = document.getElementById('segs');
  const lines = []; // {el, layers, text, t0, dd, seg}
  const segEls = SEGS.map(([t0, t1, ls], si) => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    root.append(seg);
    ls.forEach(([txt, cls], li) => {
      const g = document.createElement('div');
      g.className = 'gl ' + cls;
      const T = up(txt);
      for (const k of ['m', 'r', 'b']) { const s = document.createElement('span'); s.className = k; s.textContent = T; g.append(s); }
      seg.append(g);
      // boyutlandır
      const big = cls.includes('big');
      const maxW = cls.includes('final') ? 960 : 920;
      g.style.fontSize = '100px';
      g.style.display = 'inline-block';
      const w = g.getBoundingClientRect().width;
      g.style.display = '';
      let fs = 100 * maxW / w;
      fs = Math.min(fs, big ? (cls.includes('final') ? 400 : 200) : 136);
      g.style.fontSize = fs.toFixed(1) + 'px';
      g.style.display = 'inline-block';
      g.style.width = Math.ceil(g.getBoundingClientRect().width + 4) + 'px';
      g.style.display = '';
      const gap = si === 6 ? 1.0 : si === ATTACK ? .75 : .55;
      const ts = t0 + .15 + li * gap;
      const dd = si === FINAL ? 1.1 : Math.min(.9, .25 + T.length * .028);
      lines.push({ g, layers: [...g.children], text: T, ts, dd, si, li });
      S.cue(ts, 'decode', { dur: dd, n: T.length, final: si === FINAL });
    });
    tl.set(seg, { opacity: 1 }, t0);
    if (si !== FINAL) {
      // adım adım titreyerek kaybolur
      [0, 1, 0, .6, 0].forEach((o, k) => tl.set(seg, { opacity: o }, t1 - .25 + k * .05));
      S.cue(t1 - .3, 'glitch', { amp: si === ATTACK ? 1.2 : .8, dur: .35 });
    }
    return seg;
  });

  // saldırı bölümü: kelimeler üstü çizilir ve parçalanır
  const atkLines = lines.filter((l) => l.si === ATTACK);
  atkLines.forEach((l, k) => {
    const st = document.createElement('div');
    st.className = 'strike';
    l.g.append(st);
    const t = 39.4 + k * .3;
    tl.to(st, { scaleX: 1, duration: .16, ease: 'power4.out' }, t);
    S.cue(t, 'strike', { k });
  });
  S.cue(37.0, 'attack', { until: 41.0 });
  for (let t = 37.3; t < 39.3; t += .45) S.cue(t, 'glitch', { amp: .9, dur: .2 });

  // final
  S.cue(43.6, 'final', {});
  tl.fromTo('#ring', { opacity: 0, scale: .4 }, { opacity: .9, scale: 1, duration: .6, ease: 'expo.out', immediateRender: false }, 44.6);
  tl.to('#ring', { opacity: 0, scale: 1.25, duration: 1.2, ease: 'power2.out' }, 45.2);
  S.cue(44.6, 'shield', {});
  tl.fromTo('#ring', { opacity: 0, scale: .6 }, { opacity: .6, scale: 1.05, duration: .5, ease: 'expo.out', immediateRender: false }, 46.4);
  tl.to('#ring', { opacity: 0, scale: 1.3, duration: 1.0, ease: 'power2.out' }, 46.9);
  S.cue(46.4, 'shield', { soft: true });
  // finale saldıran ama tutunamayan gürültü
  for (const t of [45.0, 45.9, 46.2, 47.0]) S.cue(t, 'bgglitch', { amp: .9, dur: .18 });
  tl.fromTo('#sweep', { opacity: 1, y: -200 }, { opacity: 1, y: 2000, duration: 1.4, ease: 'none', immediateRender: false }, 43.9);
  tl.set('#sweep', { opacity: 0 }, 45.3);

  tl.fromTo('#fade', { opacity: 1 }, { opacity: 0, duration: .5, immediateRender: false }, 0);
  tl.to('#fade', { opacity: 1, duration: 1.4, ease: 'power1.in' }, DUR - 1.5);
  tl.set({}, {}, DUR);

  // ---------- çizim ----------
  const bg = document.getElementById('bg').getContext('2d');
  const nz = document.getElementById('noise').getContext('2d');
  const shake = document.getElementById('shake');
  const meter = document.getElementById('meter');
  for (let i = 0; i < 18; i++) meter.append(document.createElement('i'));
  const bars = [...meter.children];
  const tcEl = document.getElementById('tc'), cntEl = document.getElementById('cnt'), hexEl = document.getElementById('hex');
  const finalLine = lines.find((l) => l.si === FINAL);

  function glitchAmt(t, types) {
    let g = 0;
    for (const c of S.cues) {
      if (!types.includes(c.type)) continue;
      const d = t - c.t;
      const D = c.dur ?? .3;
      if (d >= 0 && d < D) g = Math.max(g, (c.amp ?? 1) * (1 - d / D));
    }
    return g;
  }

  S.onDraw((t) => {
    const f = Math.round(t * FPS);
    const attack = t >= 37 && t < 41 ? .35 + .3 * hashNoise(f, 5) : 0;
    const G = Math.max(glitchAmt(t, ['glitch']), attack);
    const BG = Math.max(G, glitchAmt(t, ['bgglitch']));

    // zemin: perspektif ızgara
    bg.fillStyle = '#03050a';
    bg.fillRect(0, 0, 1080, 1920);
    const hz = 1180;
    bg.strokeStyle = `rgba(25, 240, 255, ${.10 + BG * .15})`;
    bg.lineWidth = 1.5;
    for (let i = -14; i <= 14; i++) {
      bg.beginPath(); bg.moveTo(540 + i * 30, hz); bg.lineTo(540 + i * 260, 1920); bg.stroke();
    }
    const sp = (t * .9) % 1;
    for (let k = 0; k < 14; k++) {
      const z = (k + sp) / 14;
      const y = hz + Math.pow(z, 2.2) * (1920 - hz);
      bg.globalAlpha = z;
      bg.beginPath(); bg.moveTo(0, y); bg.lineTo(1080, y); bg.stroke();
    }
    bg.globalAlpha = 1;
    // tavan ızgarası (soluk)
    bg.strokeStyle = 'rgba(255, 46, 136, .05)';
    for (let i = -14; i <= 14; i++) { bg.beginPath(); bg.moveTo(540 + i * 30, 740); bg.lineTo(540 + i * 260, 0); bg.stroke(); }
    const hg = bg.createLinearGradient(0, 640, 0, 1280);
    hg.addColorStop(0, 'rgba(3,5,10,1)'); hg.addColorStop(.5, 'rgba(3,5,10,0)'); hg.addColorStop(1, 'rgba(3,5,10,1)');
    // merkez parıltı
    const rg = bg.createRadialGradient(540, 960, 0, 540, 960, 760);
    rg.addColorStop(0, `rgba(25, 120, 160, ${.18 + BG * .1})`);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    bg.fillStyle = rg; bg.fillRect(0, 0, 1080, 1920);

    // gürültü blokları
    nz.clearRect(0, 0, 1080, 1920);
    if (BG > .05) {
      const n = Math.floor(BG * 26);
      for (let i = 0; i < n; i++) {
        const y = hashNoise(f, 10 + i) * 1920, h = 4 + hashNoise(f, 40 + i) * 60;
        const x = hashNoise(f, 70 + i) * 900, w = 60 + hashNoise(f, 100 + i) * 700;
        const c = hashNoise(f, 130 + i);
        nz.fillStyle = c < .4 ? `rgba(25,240,255,${.15 + BG * .35})` : c < .75 ? `rgba(255,46,136,${.15 + BG * .3})` : `rgba(255,255,255,${.1 + BG * .25})`;
        nz.fillRect(x, y, w, h);
      }
    }

    // satırlar: çözülme + glitch katmanları
    for (const L of lines) {
      const p = (t - L.ts) / L.dd;
      const [m, r, b] = L.layers;
      let txt;
      if (p < 0) { m.style.opacity = 0; r.style.opacity = 0; b.style.opacity = 0; continue; }
      if (p >= 1) txt = L.text;
      else {
        const shown = Math.floor(L.text.length * p);
        txt = '';
        for (let i = 0; i < L.text.length; i++) {
          const ch = L.text[i];
          if (i < shown || ch === ' ') txt += ch;
          else if (i < shown + 6) txt += GLYPHS[Math.floor(hashNoise(f * 7 + i, L.si * 13 + L.li) * GLYPHS.length)];
          else txt += '\u00a0';
        }
      }
      if (m.textContent !== txt) { m.textContent = txt; r.textContent = txt; b.textContent = txt; }
      m.style.opacity = 1;
      const isFinal = L.si === FINAL;
      const isAtk = L.si === ATTACK;
      // satır başına glitch şiddeti
      let g = isFinal ? (p < 1 ? (1 - p) * .6 : 0) : Math.max(G, p < 1 ? (1 - p) * .5 : 0);
      if (isAtk) g = Math.max(g, .4 + .5 * hashNoise(f, 200 + L.li));
      if (g > .02 && hashNoise(f, 300 + L.li + L.si * 5) < .25 + g * .7) {
        const ox = (hashNoise(f, 400 + L.li) - .5) * 60 * g;
        const y0 = hashNoise(f, 500 + L.li) * 80, y1 = Math.min(100, y0 + 10 + hashNoise(f, 600 + L.li) * 40);
        r.style.opacity = .9; b.style.opacity = .9;
        r.style.transform = `translate(${-8 - 30 * g}px, ${(hashNoise(f, 700) - .5) * 8}px)`;
        b.style.transform = `translate(${8 + 30 * g}px, 0)`;
        m.style.transform = `translateX(${ox}px) skewX(${(hashNoise(f, 800 + L.li) - .5) * 30 * g}deg)`;
        m.style.clipPath = hashNoise(f, 900 + L.li) < .5 ? `inset(${y0}% 0 ${100 - y1}% 0)` : 'none';
        r.style.clipPath = `inset(0 0 ${hashNoise(f, 1000) * 50}% 0)`;
        b.style.clipPath = `inset(${hashNoise(f, 1100) * 50}% 0 0 0)`;
      } else {
        r.style.opacity = isFinal ? 0 : .0; b.style.opacity = 0;
        m.style.transform = ''; m.style.clipPath = 'none';
      }
      if (isAtk && t > 40.55) {
        // parçalanma
        const k = clamp((t - 40.55) / .4);
        L.g.style.opacity = 1 - k;
        L.g.style.filter = `blur(${k * 10}px)`;
        L.g.style.transform = `scaleY(${1 - k * .8}) scaleX(${1 + k * .3})`;
      }
    }
    // final: kusursuz, sabit, hafif nabız
    if (t >= 44.8) {
      const pulse = 1 + .015 * Math.sin((t - 44.8) * Math.PI * 2 / 1.2);
      finalLine.g.style.transform = `scale(${pulse})`;
      finalLine.g.style.textShadow = `0 0 ${30 + 20 * Math.sin(t * 3)}px rgba(25,240,255,.55)`;
    }

    // sarsıntı
    const sh = (G * 12 + S.impulse(t, ['strike', 'final'], 12, .5) * 10);
    shake.style.transform = `translate(${(hashNoise(f, 1) - .5) * sh}px, ${(hashNoise(f, 2) - .5) * sh * .5}px)`;

    // HUD
    const secs = Math.floor(t), fr = f % FPS;
    tcEl.textContent = `00:${String(secs).padStart(2, '0')}:${String(fr).padStart(2, '0')}`;
    const si = SEGS.findIndex(([a, b]) => t >= a && t < b);
    cntEl.textContent = `${String(Math.max(1, si + 1)).padStart(2, '0')} / ${SEGS.length}`;
    bars.forEach((el, i) => { el.style.height = (6 + 34 * Math.abs(smoothNoise(t * 6 + i * .7, i)) * (1 + G)) + 'px'; });
    hexEl.textContent = '0x' + Math.floor(hashNoise(Math.floor(t * 8), 3) * 0xffffff).toString(16).toUpperCase().padStart(6, '0');
  });

  S.finish();
});
</script>
</body>
</html>
