name: CI

# Every PR (and every push to main except the news bot's [skip ci] commits)
# must build, keep third-party hosts out, pass the security-rule tests and
# keep the story bot green.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # vite build directly: `npm run build` also fetches news and needs API keys.
      - run: npx vite build
      - run: node scripts/check-third-party.mjs

  security-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - run: npm ci
      - run: npm test

  instagram-stories:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram-stories
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: instagram-stories/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Renders the sample edition with the runner's Chrome, so a broken
      # template fails here and not at 08:10 on a Monday.
      - run: npm run preview -- --sample
      - uses: actions/upload-artifact@v4
        with:
          name: story-sample-slides
          path: instagram-stories/out/
